<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мероприятия — N-VECTOR Consulting Services</title>
  <meta name="description" content="Мероприятия, в которых участвовала компания N-VECTOR Consulting Services.">
  <meta name="theme-color" content="#05080e">
  <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="events">
  <a class="skip-link" href="#main" data-i18n="skip">Перейти к содержанию</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html" aria-label="N-VECTOR Consulting Services — на главную" data-i18n-attr="aria-label:brand.home">
        <img src="img/logo-mark-dark.svg" alt="" width="30" height="36">
        <span class="brand-text"><span class="brand-name">N-VECTOR</span><span class="brand-sub">Consulting Services</span></span>
      </a>
      <nav id="site-nav" class="site-nav" aria-label="Основная навигация" data-i18n-attr="aria-label:nav.label">
        <a href="index.html" data-nav="home" data-i18n="nav.home">О компании</a>
        <a href="team.html" data-nav="team" data-i18n="nav.team">Команда</a>
        <a href="projects.html" data-nav="projects" data-i18n="nav.projects">Проекты</a>
        <a href="events.html" data-nav="events" data-i18n="nav.events">Мероприятия</a>
        <a href="programs.html" data-nav="programs" data-i18n="nav.programs">Программы поддержки</a>
        <a href="contacts.html" data-nav="contacts" data-i18n="nav.contacts">Контакты</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Язык сайта" data-i18n-attr="aria-label:lang.label">
        <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="ru" lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="kz" lang="kk" aria-pressed="false">KZ</button>
      </div>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="nav-toggle-label" data-i18n="nav.menu">Меню</span>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="page-head">
      <img class="page-deco scene-piece" src="img/scene/monitor-analytics.jpg" alt="" aria-hidden="true">
      <div class="wrap">
        <p class="eyebrow" data-i18n="events.title">Мероприятия</p>
        <div class="page-head-row">
          <h1 data-i18n="events.title">Мероприятия</h1>
          <button class="btn btn-add" type="button" data-add="events"><span class="plus">+</span> <span data-i18n="events.add">Добавить мероприятие</span></button>
        </div>
        <p class="lede" data-i18n="events.lede">Выставки, конференции, конкурсы и встречи, в которых участвовала компания.</p>
        <p class="source-note" data-source-for="events"></p>
      </div>
    </section>

    <section class="wrap" style="padding-top:clamp(1.5rem,3vw,2.5rem)" aria-label="Список мероприятий" data-i18n-attr="aria-label:events.listLabel">
      <div class="list" data-list="events" aria-live="polite"><p class="loading" data-i18n="loading">Загрузка…</p></div>
    </section>
  </main>

  <button class="fab" type="button" data-add="events" aria-label="Добавить мероприятие" data-i18n-attr="aria-label:events.add">+</button>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="footer-brand"><img src="img/logo-mark-dark.svg" alt="" width="22" height="27">N-VECTOR Consulting Services</span>
      <span>© <span data-year></span> <span data-i18n="company">ТОО «N-VECTOR Consulting Services»</span></span>
    </div>
  </footer>

  <script src="data/i18n/ru.js"></script>
  <script src="data/i18n/en.js"></script>
  <script src="data/i18n/kz.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/fallback.js"></script>
  <script src="js/main.js"></script>
  <script src="js/motion.js"></script>
